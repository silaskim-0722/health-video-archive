name: Airtable 데이터 자동 갱신

on:
  schedule:
    # 매주 월요일 09:00 KST (= 일요일 24:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Airtable에서 영상 데이터 가져오기
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: python3 tools/sync.py

      - name: 변경분 커밋
        run: |
          git config user.name "video-archive-bot"
          git config user.email "video-archive-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "데이터 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
